<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1f3a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>MOUNTAIN App - Where Authors Rise</title>
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-surface: #f4f6f9;
      --navy: #0b1f3a;
      --navy-deep: #061325;
      --navy-accent: #163a6b;
      --black: #0a0a0c;
      --text-main: #111827;
      --text-muted: #4b5563;
      --border: #e5e7eb;
      --success: #065f46;
      --success-bg: #ecfdf5;
      --radius: 12px;
      --shadow-sm: 0 2px 10px rgba(11, 31, 58, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-surface);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 75px;
    }

    .container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 16px; }

    /* APP TOP BAR */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-wordmark { font-size: 1.15rem; font-weight: 900; letter-spacing: 0.08em; color: var(--black); }

    /* HERO */
    .hero-card {
      background: linear-gradient(135deg, var(--black), var(--navy));
      color: #ffffff;
      padding: 28px 20px;
      border-radius: 0 0 20px 20px;
      margin-bottom: 20px;
    }

    .hero-title { font-size: 1.65rem; font-weight: 800; margin-bottom: 8px; }
    .hero-sub { font-size: 0.92rem; color: #dbeafe; margin-bottom: 18px; }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-light { background: #ffffff; color: var(--black); }
    .btn-primary { background: var(--navy); color: #ffffff; width: 100%; }
    .btn-outline { background: transparent; border: 1.5px solid rgba(255,255,255,0.5); color: #fff; }

    /* GRID & CARDS */
    .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 14px; color: var(--black); }
    .books-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

    .book-card {
      background: #ffffff;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .book-cover {
      background: linear-gradient(135deg, #061325, #1e3a8a);
      color: #ffffff;
      padding: 24px 16px;
      text-align: center;
      font-weight: 800;
      font-size: 1.15rem;
      position: relative;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.2);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
    }

    .book-body { padding: 16px; }
    .book-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
    .book-author { font-size: 0.85rem; color: var(--navy); font-weight: 600; margin-bottom: 8px; }
    .book-price { font-size: 1.2rem; font-weight: 800; color: var(--black); margin-bottom: 8px; }
    .book-desc { font-size: 0.86rem; color: var(--text-muted); margin-bottom: 14px; }

    /* FORMS */
    .card-box { background: #fff; padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow-sm); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
    }

    .alert-success {
      background: var(--success-bg);
      color: var(--success);
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* BOTTOM APP NAVIGATION */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      height: 64px;
      z-index: 50;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.68rem;
      font-weight: 700;
      gap: 3px;
    }

    .nav-btn.active { color: var(--navy); }
    .nav-btn svg { width: 22px; height: 22px; }

    /* STATS */
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-box { background: #fff; padding: 16px; border-radius: var(--radius); text-align: center; box-shadow: var(--shadow-sm); }
    .stat-num { font-size: 1.4rem; font-weight: 900; color: var(--navy); }
    .stat-txt { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }

    @media (min-width: 768px) {
      .books-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Top Header -->

        <path d="M2 25L13.5 5L21 17.5L26 10.5L34 25H2Z" fill="#0B1F3A" stroke="#000" stroke-width="2"/>
        <path d="M13.5 5L17.2 11.4L13.5 13.5L9.8 11.4L13.5 5Z" fill="#FFF"/>
      </svg>
      <span class="brand-wordmark">MOUNTAIN</span>
    </a>
    <span style="font-size:0.75rem; font-weight:700; background:#eff6ff; color:#0b1f3a; padding:4px 10px; border-radius:20px;">APP v1.0</span>

  <!-- MAIN SCREEN CONTAINER (यहीं सारा कंटेंट दिखेगा) -->
  <main id="app"></main>

  <nav class="bottom-nav">

      <span>Home</span>
    </a>
    <a href="#search" class="nav-btn" id="nav-search" onclick="navigate('search')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>Search</span>
    </a>

      <span>Publish</span>
    </a>
    <a href="#earnings" class="nav-btn" id="nav-earnings" onclick="navigate('earnings')">

    <a href="#author" class="nav-btn" id="nav-author" onclick="navigate('author')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Author</span>

  </nav>

              </div>
            </div>

          <div class="container">

                    <div class="book-title">${b.title}</div>
                    <div class="book-author">By ${b.author}</div>
                    <div class="book-price">${b.price}</div>
                    <p class="book-desc">${b.desc}</p>
