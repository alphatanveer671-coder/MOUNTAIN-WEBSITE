<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MOUNTAIN - Where Authors Rise</title>
  <meta name="description" content="MOUNTAIN - Digital eBooks & Research Files Marketplace. Authors earn 60% on eBooks & 70% on Research Files." />
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-surface: #f7f9fc;
      --navy: #0b1f3a;
      --navy-deep: #061325;
      --navy-accent: #163a6b;
      --black: #0a0a0c;
      --text-main: #111827;
      --text-muted: #4b5563;
      --border: #e5e7eb;
      --border-strong: #cbd5e1;
      --success: #065f46;
      --success-bg: #ecfdf5;
      --warning: #92400e;
      --warning-bg: #fffbeb;
      --radius: 10px;
      --shadow-sm: 0 2px 8px rgba(11, 31, 58, 0.06);
      --shadow-md: 0 12px 32px rgba(11, 31, 58, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg-white);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; cursor: pointer; }
    button { font-family: inherit; cursor: pointer; border: none; }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* HEADER */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-icon {
      width: 34px;
      height: 26px;
      background: var(--navy);
      color: #fff;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 0.9rem;
    }

    .brand-wordmark {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--black);
    }

    .main-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
    }

    .nav-link {
      padding: 7px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      border-radius: 8px;
      white-space: nowrap;
      background: transparent;
    }

    .nav-link:hover { background: var(--bg-surface); color: var(--navy); }
    .nav-link.active { background: var(--navy); color: #ffffff; }

    @media (max-width: 768px) {
      .main-nav { display: none; }
    }

    /* Mobile Bottom Nav */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: none;
      grid-template-columns: repeat(5, 1fr);
      padding-bottom: env(safe-area-inset-bottom);
    }

    @media (max-width: 768px) {
      .mobile-bottom-nav { display: grid; }
    }

    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 8px 2px;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      background: none;
    }

    .mobile-nav-item.active { color: var(--navy); font-weight: 800; }

    .main-content {
      min-height: calc(100vh - 140px);
      padding-bottom: 88px;
    }

    .page-section { display: none; }
    .page-section.active { display: block; }

    /* HERO */
    .hero-banner {
      background: linear-gradient(135deg, var(--black) 0%, var(--navy-deep) 45%, var(--navy) 100%);
      color: #ffffff;
      padding: 40px 0 48px;
    }

    .hero-eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: 1.9rem;
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .hero-subtitle {
      font-size: 0.96rem;
      color: #dbeafe;
      max-width: 650px;
      margin-bottom: 22px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn-primary { background: #ffffff; color: var(--navy); }
    .btn-outline { background: rgba(255,255,255,0.12); color: #ffffff; border: 1px solid rgba(255,255,255,0.3); }
    .btn-navy { background: var(--navy); color: #ffffff; }
    .btn-navy:hover { background: var(--navy-accent); }
    .btn-success { background: var(--success); color: #ffffff; }

    /* SEARCH BAR */
    .search-box-wrap {
      margin: -22px auto 26px;
      max-width: 760px;
      background: #fff;
      padding: 8px;
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      padding: 10px 14px;
      font-size: 0.95rem;
    }

    /* CARDS & GRIDS */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 26px 0 14px;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--navy);
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 18px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-cover {
      height: 170px;
      background: linear-gradient(135deg, var(--navy), var(--navy-accent));
      color: #fff;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background-size: cover;
      background-position: center;
    }

    .card-cover.file-type {
      background: linear-gradient(135deg, #1f2937, #374151);
    }

    .cover-overlay {
      background: rgba(6, 19, 37, 0.68);
      padding: 8px;
      border-radius: 6px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 6px;
      background: rgba(11, 31, 58, 0.85);
      color: #fff;
      width: fit-content;
    }

    .badge-pending { background: var(--warning-bg); color: var(--warning); border: 1px solid #fcd34d; }
    .badge-live { background: var(--success-bg); color: var(--success); border: 1px solid #6ee7b7; }

    .card-body { padding: 14px; }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; color: var(--black); }
    .card-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; }
    .card-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price-tag { font-size: 1.05rem; font-weight: 800; color: var(--navy); }

    /* FORMS & PANELS */
    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 18px;
      box-shadow: var(--shadow-sm);
    }

    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 0.86rem; font-weight: 700; margin-bottom: 6px; color: var(--navy); }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 0.92rem;
    }

    .alert-box {
      padding: 14px;
      border-radius: 8px;
      font-size: 0.86rem;
      margin-bottom: 16px;
    }
    .alert-info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .alert-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid #fde68a; }
    .alert-success { background: var(--success-bg); color: var(--success); border: 1px solid #a7f3d0; }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 10px;
    }
    .stat-val { font-size: 1.45rem; font-weight: 900; color: var(--navy); }
    .stat-lbl { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }

    .split-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin: 16px 0;
    }
    .split-card {
      background: var(--bg-surface);
      border: 2px solid var(--navy);
      border-radius: 10px;
      padding: 16px;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 22px;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER -->
  <header class="site-header">
    <div class="container header-inner">
