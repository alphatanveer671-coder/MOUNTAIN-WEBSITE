<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MOUNTAIN - Where Authors Rise</title>
  <meta name="description" content="MOUNTAIN - Where Authors Rise. Digital eBooks & Research Files marketplace. Authors earn 60-70% revenue." />
  <style>
    :root {
      --bg-white: #ffffff;
      --bg-surface: #f7f9fc;
      --navy: #0b1f3a;
      --navy-deep: #061325;
      --navy-accent: #163a6b;
      --black: #0a0a0c;
      --text-main: #111827;
      --text-muted: #4b5563;
      --border: #e5e7eb;
      --border-strong: #cbd5e1;
      --success: #065f46;
      --success-bg: #ecfdf5;
      --radius: 10px;
      --shadow-sm: 0 2px 8px rgba(11, 31, 58, 0.06);
      --shadow-md: 0 12px 32px rgba(11, 31, 58, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background: var(--bg-white);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* HEADER */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand-icon { width: 34px; height: 26px; }

    .brand-wordmark {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--black);
    }

    .main-nav { display: none; align-items: center; gap: 4px; }

    .nav-link {
      padding: 7px 12px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      border-radius: 8px;
    }

    .nav-link.active { background: var(--navy); color: #ffffff; }

    /* Mobile Bottom Nav */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: #ffffff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .mobile-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 8px 2px;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .mobile-nav-item svg { width: 20px; height: 20px; }
    .mobile-nav-item.active { color: var(--navy); }

    .main-content {
      min-height: calc(100vh - 180px);
      padding-bottom: 84px;
    }

    /* HERO */
    .hero-banner {
      background: linear-gradient(135deg, var(--black) 0%, var(--navy-deep) 45%, var(--navy) 100%);
      color: #ffffff;
      padding: 40px 0 46px;
    }

    .hero-eyebrow {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 10px;
    }

    .hero-title {
      font-size: 1.9rem;
      line-height: 1.15;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .hero-subtitle {
      font-size: 1rem;
      color: #dbeafe;
      max-width: 640px;
      margin-bottom: 22px;
    }

    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 11px 18px;
      border-radius: 8px;
      border: 1.5px solid transparent;
      cursor: pointer;
    }

    .btn-primary { background: var(--navy); color: #ffffff; }
    .btn-light { background: #ffffff; color: var(--black); }
    .btn-outline-light { background: transparent; color: #ffffff; border-color: rgba(255,255,255,0.45); }
    .btn-block { width: 100%; }
    .btn-sm { padding: 8px 14px; font-size: 0.85rem; }

    /* SECTIONS & GRID */
    .section-block { padding: 28px 0; }

    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
      border-bottom: 2px solid var(--bg-surface);
      padding-bottom: 10px;
    }

    .section-title { font-size: 1.3rem; font-weight: 800; color: var(--black); }
    .section-count { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }

    .books-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }

    .book-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
    }

    .book-cover-wrap {
      position: relative;
      background: linear-gradient(135deg, #061325, #163a6b);
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 1.25rem;
      padding: 20px;
      text-align: center;
    }

    .badge-new {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--black);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .badge-type {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .badge-ebook { background: #1e3a5f; color: #93c5fd; }
    .badge-file { background: #065f46; color: #a7f3d0; }

    .book-body { padding: 14px; display: flex; flex-direction: column; flex: 1; }
    .book-title { font-size: 1.05rem; font-weight: 800; color: var(--black); margin-bottom: 3px; }
    .book-author { font-size: 0.86rem; font-weight: 600; color: var(--navy); margin-bottom: 8px; }
    .book-price { font-size: 1.18rem; font-weight: 800; color: var(--black); margin-bottom: 8px; }
    .book-short-desc { font-size: 0.86rem; color: var(--text-muted); margin-bottom: 14px; flex: 1; }

    /* SEARCH & FORMS */
    .search-hero { background: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 28px 0; }
    .search-input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      font-size: 1rem;
      border: 2px solid var(--navy);
      border-radius: 10px;
      margin-top: 12px;
    }

    .form-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      max-width: 780px;
      margin: 0 auto;
    }

    .form-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .form-group label { display: block; font-size: 0.86rem; font-weight: 700; margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 11px 12px;
      font-size: 0.95rem;
      border: 1.5px solid var(--border-strong);
      border-radius: 8px;
    }

    .alert-success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #a7f3d0;
      padding: 14px 16px;
      border-radius: 8px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* ABOUT & STATS */
    .about-hero {
      background: linear-gradient(135deg, var(--black) 0%, var(--navy-deep) 45%, var(--navy) 100%);
      color: #fff;
      padding: 40px 0;
    }

    .revenue-cards { display: grid; grid-template-columns: 1fr; gap: 16px; margin: 24px 0; }
    .revenue-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .revenue-split { display: flex; gap: 12px; margin: 12px 0; }
    .split-box { flex: 1; text-align: center; padding: 14px 8px; border-radius: 8px; font-weight: 700; }
    .split-author { background: var(--success-bg); color: var(--success); }
    .split-platform { background: #eff6ff; color: var(--navy); }
    .split-pct { font-size: 1.6rem; display: block; }

    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-surface); border-radius: 10px; padding: 16px; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--black); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

    .site-footer { background: var(--black); color: #d1d5db; padding: 28px 0 88px; }

    @media (min-width: 640px) {
      .books-grid { grid-template-columns: repeat(2, 1fr); }
      .revenue-cards { grid-template-columns: repeat(2, 1fr); }
      .stat-grid { grid-template-columns: repeat(4, 1fr); }
    }

    @media (min-width: 768px) {
      .main-nav { display: flex; }
      .mobile-bottom-nav { display: none; }
      .main-content { padding-bottom: 40px; }
      .site-footer { padding: 32px 0; }
      .hero-title { font-size: 2.5rem; }
      .books-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
    }
  </style>
</head>
<body>

    <div class="container header-inner">
      <a href="#/" class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 36 28" fill="none">
          <path d="M2 25L13.5 5L21 17.5L26 10.5L34 25H2Z" fill="#0B1F3A" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
          <path d="M13.5 5L17.2 11.4L13.5 13.5L9.8 11.4L13.5 5Z" fill="#FFFFFF"/>
        </svg>
        <span class="brand-wordmark">MOUNTAIN</span>
      </a>

      <nav class="main-nav">
